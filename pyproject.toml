[project]
name = "telco-lakehouse"
version = "0.1.0"
description = "Databricks lakehouse for a simulated German mobile operator"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/pipelines/*.py" = ["E402"]
